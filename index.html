<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* 🌍 Global Reset */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 🔥 Scaling Wrapper */
    .scale-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: top left;
    }

    /* 📦 Widget Container */
    .widget-card {
  background-color: #ffffff; /* white card */
  border-radius: 0.7rem;
  padding: 1.5rem;
  box-shadow: 0 0 1.25rem rgba(0, 0, 0, 0.1); /* softer shadow for light theme */
  width: 400px;   /* design width */
  box-sizing: border-box;
  position: relative;
  color: #191919; /* dark text */
  font-family: 'Poppins', sans-serif;
}

    /* 📌 Widget Header */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-info {
      display: flex;
      flex-direction: column;
    }

    .city-name {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .temp {
      font-size: 2.5rem;
      font-weight: 700;
    }

  .description {
  font-size: 0.9rem;
  color: #555555; /* softer dark gray */
}

    /* 🌤️ Weather Icon */
    .weather-icon img {
      width: 5rem;
      height: auto;
    }

  .rain-block {
  background-color: #e4e4e4; /* light gray block */
  border-radius: 12px;
  padding: 0.5rem 1rem;
  margin: 1rem 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-size: 1rem;
  color: #191919; /* dark text */
}

.rain-block img {
  width: 20px;
  height: 20px;
  filter: brightness(0) saturate(100%) invert(8%); /* dark icons */
}

    /* 💧 Humidity + Wind Row */
   .details-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1rem;
  font-size: 1rem;
  color: #191919; /* dark text */
}

    /* 📅 Weekly Forecast */
    .weekly-forecast {
      display: flex;
      justify-content: space-between;
      gap: 0.9rem;
    }

  .forecast-day {
  flex: 1;
  background-color: #e4e4e4; /* lighter block for white theme */
  border-radius: 12px;
  padding: 0.5rem;
  text-align: center;
  font-size: 0.9rem;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.15); /* softer shadow */
  color: #191919; /* dark text */
}

.forecast-day img {
  width: 28px;
  height: 28px;
  margin: 0.25rem 0;
  filter: brightness(0) saturate(100%) invert(8%); /* dark icons */
}

.forecast-day .day {
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.forecast-day .temps {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.2rem;
  font-size: 0.8rem;
}

.forecast-day .temp-low {
  color: #555; /* softer gray for low temp */
}

.forecast-day .temp-high {
  color: #141414; /* stronger dark for high temp */
  font-weight: 600;
}

    /* ⚙️ Settings Button */
    #settings-button {
      background: none;
      border: none;
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      cursor: pointer;
    }

  #settings-button img {
  width: 1rem;
  height: 1rem;
  filter: brightness(0) saturate(100%) invert(8%); /* dark gear icon */
}

   .settings-modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #f9f9f9; /* light background */
  border-radius: 0.625rem;
  padding: 1rem;
  display: none;
  flex-direction: column;
  z-index: 2000;
  width: min(90vw, 20rem);
  box-sizing: border-box;
  color: #191919; /* dark text */
}

.settings-modal.hidden { display: none; }
.settings-modal.visible { display: flex; }

.settings-modal label {
  margin-bottom: 0.4rem;
  font-size: 0.9rem;
  font-weight: 500;
}

.settings-modal input[type="text"],
.settings-modal select {
  display: block;
  width: 100%;
  background-color: #e4e4e4; /* light input */
  border: none;
  border-radius: 0.5rem;
  padding: 0.5rem 0.75rem;
  color: #191919; /* dark text */
  font-size: 0.9rem;
  margin-bottom: 0.75rem;
  box-sizing: border-box;
  box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.1); /* lighter shadow */
}

.settings-modal select {
  /* custom arrow */
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-position: right 0.75rem center;
  background-repeat: no-repeat;
  background-image: url("data:image/svg+xml;utf8,<svg fill='black' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
  padding-right: 2rem;
}

.modal-buttons {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
}

.settings-modal button {
  padding: 0.5rem 0.75rem;
  background-color: #191919; /* dark button */
  color: #ffffff; /* white text */
  border: none;
  border-radius: 0.5rem;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.9rem;
}
  </style>
</head>
<body>
  <!-- 🔥 Scale Wrapper -->
  <div class="scale-wrapper">
    <div id="widget-root">
      <div class="widget-card" id="weather-card">
        <div class="widget-header">
          <div class="location-info">
            <div class="city-name" id="city">New York</div>
            <div class="temp" id="temperature">--°F</div>
            <div class="description" id="description">Loading...</div>
          </div>
          <div class="weather-icon">
            <img id="weather-icon" src="icons/sun.svg" alt="Weather Icon" />
          </div>
        </div>

        <!-- 🌧 Rain Block -->
        <div class="rain-block">
          <img src="icons/rain.svg" alt="Rain" />
          <span>Rain: <span id="rain">--%</span></span>
        </div>

        <!-- 💧 Humidity + Wind Row -->
        <div class="details-row">
          <span>Humidity: <span id="humidity">--%</span></span>
          <span>Wind: <span id="wind">-- mph</span></span>
        </div>

        <!-- 📅 Weekly Forecast -->
        <div class="weekly-forecast" id="weekly-forecast">
          <!-- JS will fill in the days -->
        </div>

        <!-- ⚙ Settings Button -->
        <button id="settings-button" type="button">
          <img src="icons/settings.svg" alt="Settings" />
        </button>
      </div>

      <!-- ⚙️ Settings Modal -->
      <div class="settings-modal hidden" id="settings-modal">
        <div class="modal-content">
          <label for="city-search">City:</label>
          <input type="text" id="city-search" placeholder="Enter a city..." />

          <label for="unit-toggle">Units:</label>
          <select id="unit-toggle">
            <option value="imperial">°F</option>
            <option value="metric">°C</option>
          </select>

          <div class="modal-buttons">
            <button id="save-city" type="button">Save</button>
            <button id="close-settings" type="button">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
  <script>
    // 🔥 Auto-scaling script
    function scaleWidget() {
      const wrapper = document.querySelector(".scale-wrapper");
      const widget = document.querySelector(".widget-card");
      if (!wrapper || !widget) return;

      const parentWidth = wrapper.clientWidth;
      const parentHeight = wrapper.clientHeight;

      const designWidth = 400; // matches .widget-card width
      const designHeight = widget.offsetHeight;

      const scaleX = parentWidth / designWidth;
      const scaleY = parentHeight / designHeight;
      const scale = Math.min(scaleX, scaleY);

      widget.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", scaleWidget);
    window.addEventListener("load", scaleWidget);
  </script>
</body>
</html>
